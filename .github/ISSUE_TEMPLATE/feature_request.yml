name: Feature request
description: Propose a new capability or a change
title: "feat: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checked
    attributes:
      label: Check first
      options:
        - label: I searched the existing issues and this is not already requested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What can you not do today? Describe a concrete scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: How it might work, and which part of the project it would touch.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including workarounds you use now.
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: What is in and out of scope, compatibility concerns, anything that affects the design.
